<style>
:root{
  /* Layout: a fixed 16:9 slide scaled to the window. One statement on the left, one drawing on the right. Left-aligned.
     Baseball palette: leather white, ink navy, one stitch-red accent per slide. Single light theme, chosen for projectors. */
  --paper:#F2F4F7;
  --panel:#FFFFFF;
  --ink:#12203B;
  --muted:#56637A;
  --line:#D3DAE3;
  --line-strong:#93A0B2;
  --stitch:#D42A3C;
  --good:#1B7F5F;
  --desk:#DCE1E8;
  --tint:#E4E9F0;
  --tint2:#C9D2DE;
  --leaf:#3E9A72;
  --leaf2:#2B7656;
  --leaf3:#6DBB94;
  --bark:#8A6447;
  --tan:#C98D58;
  --tan2:#9B653A;
  --skin:#E3AC86;
  --car:#4A6A9C;
  --glass:#D9E4F1;
  --sun:#E9A23B;
  --sea:#CFDDEC;
  --sea2:#93A9C4;
  --sand:#E9D5A6;
  --flesh:#F5EACB;
  --flesh-old:#D3AB76;
  --core:#E7D3A0;
  --rot:#94653A;
  --seed:#4B3020;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--stitch);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto auto auto}

/* ---------- stage and slides ---------- */
.stage{--u:1vw;position:relative;min-height:0;overflow:hidden;display:grid;place-items:center;background:var(--desk)}
.stage:focus{outline:none}
.focus-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:none;white-space:nowrap;background:var(--ink);color:var(--paper);font:600 .85rem/1 var(--body);padding:10px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(18,32,59,.25)}
.frame{position:relative;width:calc(var(--u)*100);height:calc(var(--u)*56.25);background:var(--paper);overflow:hidden;box-shadow:0 1px 2px rgba(18,32,59,.10),0 10px 30px rgba(18,32,59,.12)}
.pg{position:absolute;right:calc(var(--u)*2.4);bottom:calc(var(--u)*1.7);font:600 calc(var(--u)*1.05)/1 var(--body);color:var(--line-strong);font-variant-numeric:tabular-nums}
.slide{display:none;position:absolute;inset:0;padding:calc(var(--u)*4) calc(var(--u)*5.5);
  grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);grid-template-rows:minmax(0,1fr);
  gap:calc(var(--u)*5);align-items:center;overflow:hidden}
.slide.is-current{display:grid;animation:enter .28s ease-out}
@keyframes enter{from{opacity:.35;transform:translateY(calc(var(--u)*.6))}to{opacity:1;transform:none}}
.copy{display:flex;flex-direction:column;gap:calc(var(--u)*1.8);min-width:0}
.eyebrow{margin:0;font:600 calc(var(--u)*1.05)/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h{margin:0;font:800 calc(var(--u)*4.9)/1.03 var(--display);letter-spacing:-.022em;text-wrap:balance}
.slide.m .h{font-size:calc(var(--u)*4.1)}
.h em{font-style:normal;color:var(--stitch)}
.sub{margin:0;font:400 calc(var(--u)*1.95)/1.35 var(--body);color:var(--muted);max-width:30em;text-wrap:pretty}
.hint{margin:calc(var(--u)*2) 0 0;font:400 calc(var(--u)*1.05)/1.4 var(--body);color:var(--muted)}
.fig{align-self:stretch;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.fig svg{width:100%;height:100%;display:block;overflow:visible}

.slide.solo{grid-template-columns:minmax(0,1fr)}
.slide.solo .copy{max-width:calc(var(--u)*66)}
.slide.solo .sub{max-width:none}
.slide.title{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
.slide.title .copy{position:relative;z-index:1;align-items:center}
.slide.title .h{font-size:calc(var(--u)*6.4)}
.slide.title .sub{font-size:calc(var(--u)*2.1)}
.slide.title .credits{position:absolute;left:0;right:0;bottom:calc(var(--u)*4.2);margin:0;text-align:center;font:400 calc(var(--u)*1.45)/1.4 var(--body);color:var(--muted);letter-spacing:.01em}
.slide.title .credits b{font-weight:600;color:var(--ink)}
.orbit-layer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.orbit-front{z-index:2}
.orbit-path{fill:none;stroke:var(--line-strong);stroke-width:.2;stroke-linecap:round;stroke-dasharray:.01 .95}
.orbit-ball circle{fill:var(--panel);stroke:var(--ink);stroke-width:.24}
.orbit-ball .seam{fill:none;stroke:var(--stitch);stroke-width:.1;stroke-linecap:round}
.orbit-ball .ticks{fill:none;stroke:var(--stitch);stroke-width:.5;stroke-dasharray:.09 .36}

/* ---------- section break: an original 80s videotape card ---------- */
.slide.vhs{background:#0A0D13;grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
.vhs .scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
.vhs .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6))}
.vhs .track{position:absolute;left:0;right:0;top:12%;height:calc(var(--u)*2.4);pointer-events:none;background:linear-gradient(transparent,rgba(255,255,255,.07),transparent)}
.vhs .osd{position:absolute;font:calc(var(--u)*2.5)/1 "VT323",ui-monospace,monospace;color:#E6ECF4;letter-spacing:.06em;text-shadow:0 0 calc(var(--u)*.4) rgba(230,236,244,.45)}
.vhs .tl{top:calc(var(--u)*3.2);left:calc(var(--u)*4)}
.vhs .tr{top:calc(var(--u)*3.2);right:calc(var(--u)*4)}
.vhs .bl{bottom:calc(var(--u)*3.2);left:calc(var(--u)*4)}
.vhs .br{bottom:calc(var(--u)*3.2);right:calc(var(--u)*4)}
.vhs .play{color:#FF5A66}
.vhs-copy{position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.2)}
.vhs-title{margin:0;font:800 calc(var(--u)*9.6)/1 var(--display);letter-spacing:-.025em;color:#F3EFE6;
  text-shadow:calc(var(--u)*.32) 0 rgba(255,40,90,.55),calc(var(--u)*-.32) 0 rgba(0,190,255,.5),0 0 calc(var(--u)*2.2) rgba(243,239,230,.18)}
.vhs-sub{margin:0;font:calc(var(--u)*2.8)/1.2 "VT323",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#AEB9C8}
.slide.vhs .pg{display:none}
@media (prefers-reduced-motion:no-preference){
  .is-current .vhs-title{animation:vhsflick 3.6s steps(1) infinite}
  .is-current .vhs-copy{animation:vhsjit 3.6s steps(1) infinite}
  .is-current .track{animation:vhstrack 4.2s linear infinite}
  .is-current .play{animation:vhsblink 1.2s steps(1) infinite}
}
@keyframes vhsflick{0%,100%{opacity:1}6%{opacity:.72}7%{opacity:1}41%{opacity:.85}42%{opacity:1}77%{opacity:.6}78%{opacity:.95}79%{opacity:1}}
@keyframes vhsjit{0%,100%{transform:none}40%{transform:translateX(calc(var(--u)*.35))}41%{transform:none}76%{transform:translateX(calc(var(--u)*-.5))}77%{transform:none}}
@keyframes vhstrack{from{top:-6%}to{top:104%}}
@keyframes vhsblink{0%,60%{opacity:1}61%,100%{opacity:.25}}

/* ---------- illustration palette ---------- */
.c-tint{fill:var(--tint)}.c-tint2{fill:var(--tint2)}.c-panel{fill:var(--panel)}
.c-leaf{fill:var(--leaf)}.c-leaf2{fill:var(--leaf2)}.c-leaf3{fill:var(--leaf3)}.c-bark{fill:var(--bark)}
.c-tan{fill:var(--tan)}.c-tan2{fill:var(--tan2)}.c-skin{fill:var(--skin)}.c-car{fill:var(--car)}.c-glass{fill:var(--glass)}
.c-sun{fill:var(--sun)}.c-sea{fill:var(--sea)}.c-sand{fill:var(--sand)}.c-core{fill:var(--core)}.c-rot{fill:var(--rot)}.c-seed{fill:var(--seed)}
.c-flesh{fill:var(--flesh-old)}
.card{fill:var(--panel);stroke:var(--line-strong);stroke-width:2}
.tile{fill:var(--tint)}
.ring{fill:none;stroke:var(--line-strong);stroke-width:2}

/* slide: tree falls on the walker */
.fall-tree,.fall-person{transform-box:view-box}
.fall-tree{transform-origin:120px 322px;transform:rotate(48deg)}
.fall-person{transform-origin:330px 322px}
.fall-ghost{opacity:.2}
/* step-by-step builds */
[data-k]{opacity:0;transition:opacity .35s ease}
[data-k].on{opacity:1}
.bsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.05)}
.bsteps li{display:grid;grid-template-columns:calc(var(--u)*2.4) minmax(0,1fr);gap:calc(var(--u)*.8);align-items:baseline}
.bsteps.static span{font-size:calc(var(--u)*1.6)}

  notes:{es:'Imaginad que estáis jugando al béisbol y la pelota viene directa hacia vosotros. Levantáis el brazo y la atrapáis. Parece trivial.\nHoy quiero convenceros de que ese gesto es un problema serio para el argumento debunking contra los objetos ordinarios. Mi tesis cabe en una frase: si nuestras creencias sobre objetos no tuvieran nada que ver con el mundo, no atraparíamos la pelota.',
         en:'Imagine you are playing baseball and the ball is coming straight at you. You raise your arm and you catch it. It seems trivial.\nToday I want to convince you that this gesture is a serious problem for the debunking argument against ordinary objects. My thesis fits in one sentence: if our object beliefs had nothing to do with the world, we would not catch the ball.'}},
 {t:31,sec:SEC.deb,size:'m',fig:F.broken,
  h:"“You believe in balls because of your <em>biology and culture</em>, not because they are there.”",
  p:"No connection between our beliefs and the object facts.",
  notes:"Let us recall the argument. The debunker says we believe in balls, dogs and trees because of contingent facts about us: our biology and our culture made us carve the world this way.\nAnd those origins, he says, have nothing to do with which objects there are. So there is no explanatory connection between our beliefs and the object facts: no doxastic one, and no alethic one."},
 {t:26,sec:SEC.deb,fig:F.luck,
  h:{es:'Si aciertas, es <em>pura suerte</em>.',en:'If you get it right, it is <em>mere luck</em>.'},
  p:{es:'Nuestra forma de partir el mundo no tendría por qué coincidir con la suya.',en:'The way we carve the world would have no reason to match its own.'},
  notes:{es:'La consecuencia es dura. Si nuestra manera de partir el mundo coincide con la manera en que el mundo está partido, es por pura suerte. Y una creencia que acierta por suerte no está justificada.\nDe ahí salen el nihilista, que dice que no hay objetos compuestos, y el permisivista, que dice que hay muchísimos más de los que creemos.',
         en:'The consequence is harsh. If the way we carve the world matches the way the world is carved, that is mere luck. And a belief that is right by luck is not justified.\nFrom here come the nihilist, who says there are no composite objects, and the permissivist, who says there are far more than we think.'}},
 {t:38,sec:SEC.rep,fig:F.turn,
  h:"Contingent does not mean <em>disconnected</em>.",
  p:"Our eyes are a contingent product of evolution. They are still connected to the photons that are really there.",
  notes:"I grant the debunker his premise: the way we carve the world is contingent on our biology and our culture. What I deny is the next step: contingent does not mean disconnected.\nThink of our eyes. That we have eyes like these is a contingent fact of evolution, yet they respond to photons that are really there.\nSo wherever a belief comes from, we can still ask: does it tell us anything about the world? To answer that, I need one tool."},
 {t:35,sec:SEC.rep,size:'m',fig:F.venn,
  h:"Mutual information: how much one thing <em>tells you</em> about another.",
  p:"If knowing one reduces your uncertainty about the other, they share information.",
  notes:"The tool is mutual information. The idea is simple: it measures how much knowing one thing tells you about another. If knowing the first reduces your uncertainty about the second, they share information.\nDark clouds and rain share information: see the clouds and you can bet on rain. A coin flip and tomorrow’s rain share none.\nThink of two circles: if they overlap, there is mutual information; if they do not touch, there is none."},
 {t:35,sec:SEC.rep,fig:F.demo,
  h:"With no shared information, all you can do is <em>guess</em>.",
  p:"If you beat chance, there is mutual information.",
  notes:"Here is what no shared information looks like. I flip a coin a thousand times and you guess each flip by looking at something unrelated, say the weather in Tokyo. [It fills by itself] You are right about half the time. That is chance.\nIf you did better than half, what you were looking at would share some information with the coin. Beating chance means there is mutual information."},
 {t:33,sec:SEC.rep,fig:F.catchIt,
  h:"And yet <em>you catch it</em>.",
  p:"It could land in countless places. It lands in one, and your hand is there.",
  notes:"Now the ball. Catching it by chance is close to impossible: there are countless places it could land, and only one where it does.\nAnd yet you catch it, almost every time, because you believe there is a ball, separate from the air and the stadium, and you predict where it will land. So our object beliefs and the world share information, whether those beliefs come from biology or from culture."},
 {t:38,sec:SEC.rep,fig:F.arrows,
  h:{es:'La información viene <em>de algún sitio</em>.',en:'Information comes <em>from somewhere</em>.'},
  p:"What happens in your mind, stays in your mind.",
  notes:"And information has to come from somewhere. If two things are related, either the first affects the second or the second affects the first.\nOur beliefs do not affect the facts: what happens in your mind, stays in your mind. So the facts must affect our beliefs. That is exactly the alethic connection the debunker denied.\nIn three steps: we predict better than chance; so our object beliefs carry information about the world; and that information comes from the world, not from us."},
 {t:8,vhs:true,
  h:"Stranger things",
  p:"Four strange objects · one test",
  notes:"[Pause for a second] Stranger things. Time for the strange objects the permissivist believes in."},
 {t:33,sec:'Strange objects',
  h:"Do I lose any prediction <em>if I drop it</em>?",
  p:"A belief that is connected to the world makes a difference to what I can predict. If dropping it costs me nothing, nothing tied it to the facts.",
  notes:"The argument has a second virtue: it explains why the permissivist’s strange objects do not count. It gives one test for any candidate: if I drop it from my beliefs, do I lose any successful prediction?\nWhy this question? Because a belief connected to the world makes a difference to what I can predict. If dropping it costs me nothing, nothing tied it to the facts. Let us try four candidates."},
 {t:32,sec:'Strange objects – mereological',fig:F.trog,
  h:"Drop the trog. <em>You lose nothing</em>.",
  p:"The dog runs. The tree stays.",
  notes:"First, the trog: a dog and a tree that together make up one object. Everything I predict with the trog I already predict with the dog or the tree alone: the dog will come to greet me, and I step away from the tree if it falls.\nNothing about the trog as a whole, neither its mass nor its trajectory, enters any prediction. If I drop it, I lose nothing."},
 {t:36,sec:'Strange objects – modal',fig:F.fall,
  h:{es:'Sin un mismo árbol, <em>nada se está cayendo</em>.',en:'Without one and the same tree, <em>nothing is falling</em>.'},
  p:{es:'Un objeto que solo existe en un ángulo no tiene trayectoria.',en:'An object that exists at only one angle has no trajectory.'},
  notes:{es:'Segundo, un caso modal. Imaginad infinitos objetos, cada uno igual que un árbol pero que solo existe mientras el tronco está en un ángulo concreto.\nUn árbol cae hacia mí. Si lo que hay es una sucesión de objetos distintos, ninguno se mueve, ninguno tiene trayectoria, y no puedo inferir que me va a aplastar. Todo lo que infiero, lo infiero del árbol que persiste.',
         en:'Second, a modal case. Imagine infinitely many objects, each just like a tree except that it exists only while the trunk is at one particular angle.\nA tree falls towards me. If what there is is a succession of different objects, none of them moves, none has a trajectory, and I cannot infer that I will be crushed. Everything I infer, I infer from the tree that persists.'}},
 {t:36,sec:'Strange objects – temporal',size:'m',fig:F.apple,
  h:{es:'Es <em>la misma</em> manzana. Por eso sé que ya no está fresca.',en:'It is <em>the same</em> apple. That is how I know it is no longer fresh.'},
  p:{es:'Persistir es lo que hace que el pasado informe del futuro.',en:'Persistence is what makes the past informative about the future.'},
  notes:{es:'Tercero, el caso temporal: contar la manzana de cada día como un objeto distinto. Una manzana lleva tres días en mi mesa y por fuera está igual. Aun así sé que ya no está tan fresca.\nLo sé porque es la misma manzana. Si la de hoy fuera un objeto nuevo, nada de lo que sé de la de ayer me diría algo sobre ella.',
         en:'Third, the temporal case: counting each day’s apple as a different object. An apple has been on my desk for three days and from the outside it looks just the same. Still, I know that inside it is starting to go bad.\nI know because it is the same apple. If today’s apple were a new object, nothing I know about yesterday’s would tell me anything about it.'}},
 {t:27,sec:'Strange objects – containment',fig:F.alike,
  h:"Incars and islands <em>look alike</em>.",
  p:"Both are defined by what contains them: the garage and the sea.",
  notes:"Fourth, the hardest case: the incar, a car that exists only while it is inside a garage. It looks a lot like an island, which is land that counts as an island while the sea surrounds it.\nBoth are defined by what contains them. That is why the permissivist says: if you accept islands, you should accept incars."},
 {t:55,sec:'Strange objects – containment',size:'m',fig:F.incar,build:5,
  h:"Drop the incar. <em>You lose nothing</em>.",
  steps:["The car backs out of the garage.","Both halves move together.","I cannot infer the trajectory of the inside half on its own, only of both halves together. So the half outside is part of the same object.","And that half gets wet.","Either the incar includes the wet half, and then it is just a car, or the incar is not the object we are talking about."],
  notes:"This is the hardest step, so let us go slowly. At first the whole car is inside: car and incar coincide. [→] Now the car backs out of the garage, and by definition the incar shrinks to the half still inside. [→] But both halves move together, at the same speed and in the same direction. [→] And I cannot infer the trajectory of the inside half on its own: every inference I make about where it is going takes both halves together. So the half outside is part of the same object as the half inside. [→] And it is raining: that half gets wet. [→] So the defender of incars has two options. If the incar includes the wet half, it is just a car. If it does not, the incar is not the object we are talking about. Either way, dropping it costs me nothing."},
 {t:30,sec:'Strange objects – containment',fig:F.island,build:1,
  h:"Drop the island.<br><em>You lose predictions</em>.",
  p:"Because the sea surrounds it, I can infer how many people can live there and that a fire cannot spread beyond its shore. If the sea covers it, these inferences stop holding.",
  notes:"Now the island. Because it is surrounded by water, I can infer things about it: how many people can live there, and that a fire cannot spread further than its shore. What surrounds the island really isolates it. [→] And if the sea covers it, all these inferences stop holding. So dropping the island is not free: I lose predictions."},
 {t:26,sec:'Strange objects – containment',fig:F.isolate,
  h:"The garage <em>does not isolate</em>. The sea does.",
  p:"The shore stops what happens on the island. The garage door stops nothing that happens to the car.",
  notes:"So here is the difference. Both are defined by what contains them, but only the sea isolates: the shore stops the fire, and it stops me. The garage door stops nothing that happens to the car.\nThat is why the test separates them: drop the incar and I lose nothing; drop the island and I lose predictions."},
 {t:24,sec:SEC.obj,size:'m',fig:F.atoms,
  h:{es:'«Solo hay <em>átomos</em> dispuestos en forma de pelota.»',en:'“There are only <em>atoms</em> arranged ball-wise.”'},
  p:{es:'Una conexión con la materia, no con los objetos.',en:'A connection with matter, not with objects.'},
  notes:{es:'¿Qué respondería el debunker? Diría: tu argumento muestra una conexión con cómo está dispuesta la materia, no con hechos sobre objetos. Unos átomos dispuestos en forma de pelota te dejarían atraparlos igual, aunque no hubiera ninguna pelota.\nEs la objeción más fuerte, y hay que tomársela en serio.',
         en:'What would the debunker reply? He would say: your argument shows a connection with how matter is arranged, not with object facts. Atoms arranged ball-wise would let you catch them just the same, even if there were no ball at all.\nThis is the strongest objection, and it deserves to be taken seriously.'}},
 {t:45,sec:SEC.obj,size:'m',fig:F.regroup,build:4,
  h:"Not every way of grouping atoms <em>works</em>.",
  steps:["I do not need to conclude that there are balls.","An inference that beats chance, however slightly, carries information about the facts.","Not every grouping of atoms allows such inferences: the ball’s atoms do; half of them with the air around do not.","So which partitions are useful depends on the world, not on luck."],
  notes:"My reply has three moves. [→] First, I do not need to conclude that there are balls. [→] Second, any inference that beats chance, however slightly, carries some information about the facts. [→] Third, not every grouping of atoms allows such inferences. Group the atoms of the ball and I can predict where it will land. Group half of them with the air around it, and I predict nothing. [→] So which partitions are useful depends on what the world is like. Getting it right is not a matter of luck, and that is all the alethic connection needs."},
 {t:40,sec:SEC.end,size:'m',fig:F.linked,
  h:"You caught the ball.<br><em>It was not luck.</em>",
  points:["Our object beliefs are contingent on our biology and our culture.","But they predict the world far better than chance, so they share information with it.","That information comes from the facts: there is an alethic connection.","Objects that make no difference to our predictions, like trogs or incars, fail the test."],
  concl:"Contingent, yes. Disconnected, no.",
  notes:"Let me go back to where we started: you caught the ball. Our object beliefs are contingent on our biology and our culture. But they let us predict the world far better than chance, so they share information with it, and that information can only come from the facts. That is an alethic connection.\nAnd the same test tells ordinary objects apart from trogs, incars and the rest: they make no difference to what we can predict.\nThis does not refute the nihilist or the permissivist, but it takes the debunking argument away from them. Contingent, yes. Disconnected, no. Thank you.",
  qa:["“The atoms, taken together, already have a trajectory.” Then you are already treating them as a unit: how is that different from my ball?",
      "“What about culture?” The argument never mentions where a belief comes from, only that it predicts better than chance.",
      "“Ptolemy also predicted well.” Yes, and that is why his model carried real information about the sky. I do not claim everything is true, only that there is a connection.",
      "“What if beliefs and facts have a common cause?” That would still be an explanatory connection between them, which is what the debunker denies."]}
];

/* ---------- coin demo ---------- */
var N=1000,demo=null,demoRun=0;
function genDemo(mode){
  var p=mode?0.8:0.5,res=[],h=0,k,x;
  for(k=0;k<N;k++){x=Math.random()<p;res.push(x);if(x)h++;}
  demo={mode:mode,res:res,hits:h};
}
function demoOut(h,n){
  var pct=n?Math.round(100*h/n):0,el;
  el=document.getElementById('demoFill');if(el)el.style.width=pct+'%';
  el=document.getElementById('demoPct');if(el)el.textContent=lang==='es'?pct+' %':pct+'%';
  el=document.getElementById('demoHits');if(el)el.textContent=lang==='es'?h+' aciertos de '+n:h+' hits out of '+n;
  el=document.getElementById('demoVerdict');
  if(el){
    if(n<N){el.textContent=' ';el.className='verdict';}
    else if(demo.mode){el.textContent=T({es:'Mejor que el azar',en:'Better than chance'});el.className='verdict good';}
    else{el.textContent=T({es:'Puro azar',en:'Pure chance'});el.className='verdict';}
  }
}
function paintDemo(animate){
  var box=document.getElementById('dots');if(!box)return;
  if(!demo)genDemo(0);
  var cells=box.children,upto=0,hits=0,k,run=++demoRun,step=Math.ceil(N/150);
  var b0=document.getElementById('demo0'),b1=document.getElementById('demo1');
  if(b0)b0.setAttribute('aria-pressed',demo.mode?'false':'true');
  if(b1)b1.setAttribute('aria-pressed',demo.mode?'true':'false');
  for(k=0;k<N;k++)cells[k].className='';
  function draw(n){for(;upto<n;upto++){cells[upto].className=demo.res[upto]?'h':'m';if(demo.res[upto])hits++;}demoOut(hits,upto);}
  if(!animate||reduced){draw(N);return;}
  (function frame(){if(run!==demoRun)return;draw(Math.min(N,upto+step));if(upto<N)requestAnimationFrame(frame);})();
}
function runDemo(mode){genDemo(mode);paintDemo(true);}

/* ---------- slide 1: the ball orbits the title on a tilted ring, in front of the text and then behind it ---------- */
var orbit={raf:0,t0:0,cx:50,cy:26,rx:36,ry:8,tilt:-20,start:2.6,period:9000,R:3.2,front:null};
function orbitPoint(th){
  var a=orbit.tilt*Math.PI/180,lx=orbit.rx*Math.cos(th),ly=orbit.ry*Math.sin(th);
  return [orbit.cx+lx*Math.cos(a)-ly*Math.sin(a),orbit.cy+lx*Math.sin(a)+ly*Math.cos(a)];
}
function placeBall(th){
  var g=document.getElementById('orbitBall');if(!g)return;
  var s=Math.sin(th),pt=orbitPoint(th),k=1+0.28*s,front=s>0;
  if(front!==orbit.front){
    var layer=document.getElementById(front?'orbitFront':'orbitBack');
    if(layer){layer.appendChild(g);orbit.front=front;}
  }
  g.setAttribute('transform','translate('+pt[0].toFixed(3)+' '+pt[1].toFixed(3)+') scale('+k.toFixed(3)+') rotate('+(th*115).toFixed(1)+')');
}
function layoutOrbit(){
  var copy=document.getElementById('titleCopy'),back=document.getElementById('orbitPath'),arc=document.getElementById('orbitArc');
  if(!copy||!back||!arc||!copy.offsetWidth)return;
  var u=frame.clientWidth/100;if(!u)return;
  orbit.cx=(copy.offsetLeft+copy.offsetWidth/2)/u;
  orbit.cy=(copy.offsetTop+copy.offsetHeight/2)/u;
  orbit.rx=Math.min(copy.offsetWidth/2/u+5,40);
  back.setAttribute('cx',orbit.cx.toFixed(2));back.setAttribute('cy',orbit.cy.toFixed(2));
  back.setAttribute('rx',orbit.rx.toFixed(2));back.setAttribute('ry',orbit.ry.toFixed(2));
  back.setAttribute('transform','rotate('+orbit.tilt+' '+orbit.cx.toFixed(2)+' '+orbit.cy.toFixed(2)+')');
  var d='',k,pt;
  for(k=0;k<=48;k++){pt=orbitPoint(Math.PI*k/48);d+=(k?' L':'M')+pt[0].toFixed(2)+' '+pt[1].toFixed(2);}
  arc.setAttribute('d',d);
}
function orbitFrame(now){
  if(cur!==0){orbit.raf=0;return;}
  if(!orbit.t0)orbit.t0=now;
  placeBall(orbit.start+(now-orbit.t0)/orbit.period*2*Math.PI);
  orbit.raf=requestAnimationFrame(orbitFrame);
}
function startOrbit(){
  layoutOrbit();
  if(reduced){placeBall(orbit.start);return;}
  if(!orbit.raf){placeBall(orbit.start);orbit.raf=requestAnimationFrame(orbitFrame);}
}

/* ---------- timer ---------- */
var timer={acc:0,t0:0,running:false,started:false,
  elapsed:function(){return (this.acc+(this.running?Date.now()-this.t0:0))/1000;},
  start:function(){if(!this.running){this.t0=Date.now();this.running=true;this.started=true;}},
  pause:function(){if(this.running){this.acc+=Date.now()-this.t0;this.running=false;}},
  reset:function(){this.acc=0;this.running=false;this.started=false;}
};
var cum=[],total=0;
SL.forEach(function(s){total+=s.t;cum.push(total);});
function fmt(sec){sec=Math.max(0,Math.round(sec));var m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s;}

/* ---------- rendering ---------- */
var $=function(id){return document.getElementById(id);};
var stage=$('stage'),frame=$('frame');
function strip(h){return h.replace(/<[^>]+>/g,'');}
function titleHTML(s,i){
  var seamL='M-2.09 -2.39 Q -0.47 0 -2.09 2.39',seamR='M2.09 -2.39 Q 0.47 0 2.09 2.39';
  return '<section class="slide title" aria-roledescription="slide" aria-label="'+(i+1)+' / '+SL.length+'">'+
    '<svg class="orbit-layer orbit-back" id="orbitBack" viewBox="0 0 100 56.25" aria-hidden="true" focusable="false">'+
      '<ellipse class="orbit-path" id="orbitPath" cx="50" cy="26" rx="36" ry="8"/>'+
      '<g class="orbit-ball" id="orbitBall"><circle r="3.2"/>'+
        '<path class="ticks" d="'+seamL+'"/><path class="ticks" d="'+seamR+'"/>'+
        '<path class="seam" d="'+seamL+'"/><path class="seam" d="'+seamR+'"/></g>'+
    '</svg>'+
    '<svg class="orbit-layer orbit-front" id="orbitFront" viewBox="0 0 100 56.25" aria-hidden="true" focusable="false">'+
      '<path class="orbit-path" id="orbitArc" d=""/>'+
    '</svg>'+
    '<div class="copy" id="titleCopy"><h2 class="h">'+T(s.h)+'</h2><p class="sub">'+T(s.p)+'</p></div>'+
    '<p class="credits"><b>Massimo Angelini</b> · Ontology · Master APhil, Universitat de Barcelona · 2026</p>'+
    '<span class="pg" aria-hidden="true">'+(i+1)+'</span></section>';
}
function vhsHTML(s,i){
  var at=i?cum[i-1]:0,m=Math.floor(at/60),sec=Math.round(at%60);
  return '<section class="slide vhs" aria-roledescription="slide" aria-label="'+(i+1)+' / '+SL.length+'">'+
    '<div class="track"></div><div class="scan"></div><div class="vig"></div>'+
    '<span class="osd tl"><span class="play">▶</span> PLAY</span><span class="osd tr">SP</span>'+
    '<span class="osd bl">CH 03</span><span class="osd br">0:'+(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec+'</span>'+
    '<div class="vhs-copy"><h2 class="vhs-title">'+T(s.h)+'</h2><p class="vhs-sub">'+T(s.p)+'</p></div>'+
    '<span class="pg" aria-hidden="true">'+(i+1)+'</span></section>';
}
function slideHTML(s,i){
  if(s.title)return titleHTML(s,i);
  if(s.vhs)return vhsHTML(s,i);
  return '<section class="slide'+(s.size?' '+s.size:'')+(s.fig?'':' solo')+'" aria-roledescription="slide" aria-label="'+(i+1)+' / '+SL.length+'">'+
    '<div class="copy">'+(s.sec?'<p class="eyebrow">'+T(s.sec)+'</p>':'')+
    '<h2 class="h">'+T(s.h)+'</h2>'+(s.p?'<p class="sub">'+T(s.p)+'</p>':'')+
    (s.points?'<ol class="bsteps static">'+s.points.map(function(x,k){return '<li><b>'+(k+1)+'</b><span>'+x+'</span></li>';}).join('')+'</ol>':'')+
    (s.concl?'<p class="concl">'+s.concl+'</p>':'')+
    (s.steps?'<ol class="bsteps">'+s.steps.map(function(x,k){return '<li data-k="'+(k+1)+'"><b>'+(k+1)+'</b><span>'+x+'</span></li>';}).join('')+'</ol>':'')+
    (i===0?'<p class="hint">'+UI[lang].hint+'</p>':'')+'</div>'+
    (s.fig?'<div class="fig">'+s.fig()+'</div>':'')+'<span class="pg" aria-hidden="true">'+(i+1)+'</span></section>';
}
function kbd(k){return '<kbd>'+k+'</kbd>';}
function labels(){
  var u=UI[lang];
  $('bPrev').innerHTML='← '+u.prev;
  $('bNext').innerHTML=u.next+' →';
  $('bNotes').innerHTML=u.notes+kbd('N');
  $('bFull').innerHTML=u.full+kbd('F');
  $('bReset').textContent=u.reset;
}
function render(){
  document.documentElement.lang=lang;
  frame.innerHTML=SL.map(slideHTML).join('');
  paintDemo(false);
  labels();
  update();
}
function update(){
  var kids=frame.children,i,s=SL[cur],u=UI[lang],html;
  for(i=0;i<kids.length;i++){
    kids[i].classList.toggle('is-current',i===cur);
    kids[i].setAttribute('aria-hidden',i===cur?'false':'true');
  }
  $('prog').style.width=(cur/(SL.length-1)*100)+'%';
  $('count').textContent=(cur+1)+' / '+SL.length;
  html=T(s.notes).split('\n').map(function(p){return '<p>'+p.replace(/\[([^\]]+)\]/g,'<span class="cue">$1</span>')+'</p>';}).join('');
  if(s.qa)html+='<h3>'+u.qa+'</h3><ul>'+T(s.qa).map(function(q){return '<li>'+q+'</li>';}).join('')+'</ul>';
  $('nScript').innerHTML=html;
  $('nNext').innerHTML=u.nextUp+' <b>'+(cur<SL.length-1?strip(T(SL[cur+1].h)):u.end)+'</b>';
  $('target').textContent=u.target.replace('{a}',fmt(s.t)).replace('{b}',fmt(total));
  tick();
  if(cur===0)startOrbit();
  if(SL[cur].fig===F.demo)runDemo(0);
  applyStep();
}
function tick(){
  var u=UI[lang],e=timer.elapsed(),st=$('status'),start=cur?cum[cur-1]:0,end=cum[cur];
  $('clock').textContent=fmt(e);
  $('bTimer').textContent=timer.running?u.pause:u.start;
  if(!timer.started){st.textContent=u.idle;st.className='status';return;}
  if(e>end){st.textContent=u.late.replace('{t}',fmt(e-end));st.className='status late';}
  else if(e<start){st.textContent=u.early.replace('{t}',fmt(start-e));st.className='status early';}
  else{st.textContent=u.onTime;st.className='status';}
}
var step=0;
function applyStep(){
  var sl=frame.children[cur];if(!sl)return;
  sl.setAttribute('data-step',step);
  Array.prototype.forEach.call(sl.querySelectorAll('[data-k]'),function(e){
    var k=+e.getAttribute('data-k'),u=e.hasAttribute('data-until')?+e.getAttribute('data-until'):99;
    e.classList.toggle('on',step>=k&&step<=u);
  });
  Array.prototype.forEach.call(sl.querySelectorAll('[data-move]'),function(e){e.classList.toggle('out',step>=+e.getAttribute('data-move'));});
}
function go(n,m){
  n=Math.max(0,Math.min(SL.length-1,n));
  if(n===cur)return;
  if(cur===0&&!timer.started)timer.start();
  cur=n;step=(m==='end')?(SL[n].build||0):0;update();
}
function fwd(){var b=SL[cur].build||0;if(step<b){if(cur===0&&!timer.started)timer.start();step++;applyStep();}else go(cur+1);}
function back(){if(step>0){step--;applyStep();}else go(cur-1,'end');}
function setNotes(open){
  notesOpen=open;
  $('notes').hidden=!open;
  $('bNotes').setAttribute('aria-pressed',open?'true':'false');
  fit();
}
function full(){
  try{
    var d=document,p;
    if(d.fullscreenElement){if(d.exitFullscreen)d.exitFullscreen();}
    else if(d.documentElement.requestFullscreen){p=d.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){});}
  }catch(e){}
}
function fit(){
  var r=stage.getBoundingClientRect();
  if(!r.width||!r.height)return;
  var pad=document.fullscreenElement?0:Math.min(14,r.width*0.02);
  var u=Math.min((r.width-2*pad)/100,(r.height-2*pad)/56.25);
  stage.style.setProperty('--u',Math.max(u,1).toFixed(3)+'px');
  if(cur===0)layoutOrbit();
}

/* ---------- events ---------- */
function click(id,fn){$(id).addEventListener('click',function(e){fn();e.currentTarget.blur();});}
click('bPrev',back);
click('bNext',fwd);
click('bNotes',function(){setNotes(!notesOpen);});
click('bFull',full);
click('bTimer',function(){if(timer.running)timer.pause();else timer.start();tick();});
click('bReset',function(){timer.reset();tick();});

stage.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-demo]'):null;
  if(b){runDemo(+b.getAttribute('data-demo'));b.blur();}
});

var CODES={39:'ArrowRight',37:'ArrowLeft',40:'ArrowDown',38:'ArrowUp',34:'PageDown',33:'PageUp',32:' ',13:'Enter',8:'Backspace',36:'Home',35:'End'};
var ALIAS={Right:'ArrowRight',Left:'ArrowLeft',Down:'ArrowDown',Up:'ArrowUp',Spacebar:' '};
window.addEventListener('keydown',function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key||CODES[e.keyCode]||'',onBtn=e.target&&e.target.tagName==='BUTTON';
  k=ALIAS[k]||k;
  if(onBtn&&(k===' '||k==='Enter'))return;
  if(k==='ArrowRight'||k==='ArrowDown'||k==='PageDown'||k===' '||k==='Enter'){e.preventDefault();fwd();}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){e.preventDefault();back();}
  else if(k==='Home'){e.preventDefault();go(0);}
  else if(k==='End'){e.preventDefault();go(SL.length-1);}
  else if(k==='n'||k==='N')setNotes(!notesOpen);
  else if(k==='f'||k==='F')full();
  else if(k==='t'||k==='T'){if(timer.running)timer.pause();else timer.start();tick();}
},true);

/* keyboard focus: the page sits inside a viewer frame, so keys only arrive once the frame has focus */
function grabFocus(){
  try{window.focus();}catch(e){}
  var a=document.activeElement;
  if(!a||a===document.body||a===document.documentElement){try{stage.focus({preventScroll:true});}catch(e){}}
}
function syncFocus(){
  var has=true;
  try{has=document.hasFocus();}catch(e){}
  $('focusHint').hidden=has;
}
window.addEventListener('focus',syncFocus);
window.addEventListener('blur',syncFocus);
document.addEventListener('pointerdown',function(){setTimeout(function(){grabFocus();syncFocus();},0);},true);
document.addEventListener('visibilitychange',function(){if(!document.hidden){grabFocus();syncFocus();}});

var tx=null,ty=null;
stage.addEventListener('touchstart',function(e){
  if(e.target.closest&&e.target.closest('button')){tx=null;return;}
  tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;
},{passive:true});
stage.addEventListener('touchend',function(e){
  if(tx===null)return;
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0)fwd();else back();}
  tx=null;
},{passive:true});

window.addEventListener('resize',fit);
document.addEventListener('fullscreenchange',fit);
if(window.ResizeObserver){try{new ResizeObserver(fit).observe(stage);}catch(e){}}
setInterval(function(){tick();syncFocus();},500);

fit();
render();
if(document.fonts&&document.fonts.ready&&document.fonts.ready.then){document.fonts.ready.then(function(){if(cur===0)layoutOrbit();});}
grabFocus();
syncFocus();
})();
</script>
</body>
